name: Android CI

on:
  push:
    branches: [ "main", "claude/**" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-37.0 build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (core + app, Robolectric with native graphics)
        run: ./gradlew :core:test :app:testDebugUnitTest --stacktrace

      # Production signing: the upload key comes from repository secrets as base64
      # (docs/store/PLAY_RELEASE.md). Without it, release builds use the public dev key and must
      # not be uploaded to Play.
      - name: Upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.FOLDMOTION_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "FOLDMOTION_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          fi

      - name: Build APKs and App Bundle
        env:
          FOLDMOTION_KEYSTORE_PASSWORD: ${{ secrets.FOLDMOTION_KEYSTORE_PASSWORD }}
          FOLDMOTION_KEY_ALIAS: ${{ secrets.FOLDMOTION_KEY_ALIAS }}
          FOLDMOTION_KEY_PASSWORD: ${{ secrets.FOLDMOTION_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:assembleDebug :app:bundleRelease

      - name: Remove upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: fold-motion-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/mapping/release/mapping.txt

      - uses: actions/upload-artifact@v4
        with:
          name: fold-motion-aab
          path: app/build/outputs/bundle/release/*.aab

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-and-reports
          path: |
            app/build/screenshots/
            app/build/reports/tests/
            core/build/reports/tests/
