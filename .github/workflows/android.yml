name: Android CI

on:
  push:
    branches: [ "main", "claude/**" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-37.0 build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (core + app, Robolectric with native graphics)
        run: ./gradlew :core:test :app:testDebugUnitTest --stacktrace

      - name: Build APKs
        env:
          # Production signing comes from repository secrets; without them the dev key is used.
          FOLDMOTION_KEYSTORE: ${{ secrets.FOLDMOTION_KEYSTORE_PATH }}
          FOLDMOTION_KEYSTORE_PASSWORD: ${{ secrets.FOLDMOTION_KEYSTORE_PASSWORD }}
          FOLDMOTION_KEY_ALIAS: ${{ secrets.FOLDMOTION_KEY_ALIAS }}
          FOLDMOTION_KEY_PASSWORD: ${{ secrets.FOLDMOTION_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: fold-motion-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/mapping/release/mapping.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-and-reports
          path: |
            app/build/screenshots/
            app/build/reports/tests/
            core/build/reports/tests/
